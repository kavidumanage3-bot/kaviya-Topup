<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAVIYA STORE | Top Up</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f8f9fa;
color:#222;
}

.container{
max-width:1200px;
margin:0 auto;
padding:30px 20px;
}

.page-title{
text-align:center;
margin-bottom:40px;
padding-top:20px;
}
.page-title h1{
font-size:36px;
color:#ff6b00;
margin-bottom:10px;
}
.page-title p{
color:#666;
}

.package-section{
margin-bottom:60px;
}

.package-title{
font-size:24px;
font-weight:700;
margin-bottom:20px;
color:#333;
border-left:4px solid #ff6b00;
padding-left:15px;
}

.grid{
display:grid;
grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
gap:20px;
}

.card{
background:#fff;
border-radius:20px;
padding:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
transition:0.3s;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 10px 30px rgba(255,107,0,0.15);
}

.card img{
width:90px;
height:90px;
object-fit:cover;
margin-bottom:15px;
border-radius:15px;
}

.card h3{
font-size:16px;
font-weight:600;
margin-bottom:8px;
color:#333;
min-height:40px;
}

.price{
font-size:20px;
font-weight:700;
color:#ff6b00;
margin-bottom:15px;
}
.price span{
font-size:14px;
color:#666;
font-weight:500;
}

.buy-btn{
padding:10px 25px;
background:linear-gradient(90deg, #ff6b00, #ff8a00);
color:#fff;
border:none;
border-radius:30px;
font-weight:600;
cursor:pointer;
transition:0.3s;
width:100%;
}
.buy-btn:hover{
transform:scale(1.05);
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:9999;
justify-content:center;
align-items:center;
}
.modal.active{
display:flex;
}
.modal-content{
background:#fff;
padding:30px;
border-radius:20px;
width:90%;
max-width:400px;
text-align:center;
}
.modal-content h2{
margin-bottom:15px;
color:#ff6b00;
font-size:18px;
}
.modal-content input{
width:100%;
padding:12px;
border:2px solid #ddd;
border-radius:10px;
margin:15px 0;
font-size:16px;
}
.modal-content button{
padding:12px 30px;
background:#ff6b00;
color:#fff;
border:none;
border-radius:10px;
font-weight:600;
cursor:pointer;
}
.close{
float:right;
font-size:24px;
cursor:pointer;
color:#999;
}

footer{
background:#111;color:#fff;padding:40px 20px;text-align:center;margin-top:60px;
}

</style>
</head>
<body>

<div class="container">
<div class="page-title">
<h1>Free Fire Diamond Top Up</h1>
<p>Fast & Secure - 1 to 5 Minutes Delivery</p>
</div>

<div id="packages"></div>

</div>

<!-- UID Modal -->
<div class="modal" id="uidModal">
<div class="modal-content">
<span class="close" onclick="closeModal()">&times;</span>
<h2 id="modalTitle">Complete Your Order</h2>
<p id="modalPrice"></p>
<input type="text" id="uidInput" placeholder="Enter Your Free Fire UID" maxlength="12">
<button onclick="submitOrder()">BUY NOW</button>
</div>
</div>

<footer>
<h2>KAVIYA STORE</h2>
<p>Fast & Secure Free Fire Top Up</p>
<p>© 2026 KAVIYA STORE. All Rights Reserved.</p>
</footer>

<script>

// Dan me wage [name, price, photo] widiyata danna
const packagesData = [
  {
    title:"MEMBERSHIP",
    items:[
      ["WEEKLY LITE MEMBERSHIP",130,"membership1.jpg"],
      ["WEEKLY MEMBERSHIP",520,"membership2.jpg"],
      ["MONTHLY MEMBERSHIP",2560,"membership3.jpg"],
      ["VIP MEMBERSHIP",3080,"vip1.jpg"],
      ["VIP PLUS MEMBERSHIP",3210,"vip2.jpg"],
      ["S VIP MEMBERSHIP",4640,"svip1.jpg"],
      ["S VIP PLUS MEMBERSHIP",5160,"svip2.jpg"]
    ]
  },
  {
    title:"DIAMOND PACK",
    items:[
      ["25 💎",100,"diamond25.jpg"],
      ["50 💎",200,"diamond50.jpg"],
      ["100 💎",400,"diamond100.jpg"],
      ["310 💎",950,"diamond310.jpg"],
      ["520 💎",1580,"diamond520.jpg"],
      ["1060 💎",3020,"diamond1060.jpg"],
      ["2180 💎",6020,"diamond2180.jpg"],
      ["5600 💎",14700,"diamond5600.jpg"],
      ["11500 💎",31000,"diamond11500.jpg"],
      ["23000 💎",61000,"diamond23000.jpg"],
      ["46000 💎",124020,"diamond46000.jpg"]
    ]
  },
  {
    title:"LEVEL UP PASS PACKAGE",
    items:[
      ["LEVEL 6",180,"level6.jpg"],
      ["LEVEL 10",300,"level10.jpg"],
      ["LEVEL 15",300,"level15.jpg"],
      ["LEVEL 20",300,"level20.jpg"],
      ["LEVEL 25",300,"level25.jpg"],
      ["LEVEL 30",450,"level30.jpg"]
    ]
  },
  {
    title:"EVO ACCESS PACKAGE",
    items:[
      ["EVO ACCESS — 3 DAY",200,"evo3.jpg"],
      ["EVO ACCESS — 7 DAY",350,"evo7.jpg"],
      ["EVO ACCESS — 30 DAY",900,"evo30.jpg"]
    ]
  }
];

const packagesDiv = document.getElementById('packages');

packagesData.forEach(pkg => {
  let html = `<div class="package-section">`;
  html += `<h2 class="package-title">${pkg.title}</h2>`;
  html += `<div class="grid">`;
  
  pkg.items.forEach(item => {
    html += `
    <div class="card">
      <img src="${item[2]}" alt="${item[0]}">
      <h3>${item[0]}</h3>
      <div class="price">Rs. ${item[1]} <span>LKR</span></div>
      <button class="buy-btn" onclick="openModal('${item[0]}', ${item[1]})">BUY NOW</button>
    </div>
    `;
  });
  
  html += `</div></div>`;
  packagesDiv.innerHTML += html;
});

// Modal functions
function openModal(name, price){
  document.getElementById('modalTitle').innerText = name;
  document.getElementById('modalPrice').innerText = 'Price: Rs. ' + price + ' LKR';
  document.getElementById('uidModal').classList.add('active');
}
function closeModal(){
  document.getElementById('uidModal').classList.remove('active');
}
function submitOrder(){
  let uid = document.getElementById('uidInput').value;
  if(uid === ''){
    alert('Please enter your UID');
    return;
  }
  alert('Order Placed! \nPackage: ' + document.getElementById('modalTitle').innerText + '\nUID: ' + uid + '\n\nWe will contact you soon!');
  closeModal();
  document.getElementById('uidInput').value = '';
}

</script>
</body>
</html>
