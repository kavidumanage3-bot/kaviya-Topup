<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAVIYA STORE</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#fff;
}

header{
background:#ffffff;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 3px 10px rgba(0,0,0,.1);
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:24px;
font-weight:700;
color:#0066ff;
}

nav ul{
display:flex;
list-style:none;
gap:20px;
}

nav a{
text-decoration:none;
color:#222;
font-weight:600;
transition:.3s;
}

nav a:hover{
color:#0066ff;
}

.login{
background:#0066ff;
color:white;
padding:10px 18px;
border-radius:30px;
text-decoration:none;
font-weight:600;
}

.hero{
height:500px;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.hero h1{
font-size:45px;
color:#111;
}

.hero p{
margin-top:10px;
font-size:18px;
color:#555;
}

.btn{
margin-top:25px;
display:inline-block;
padding:15px 35px;
background:#0066ff;
color:white;
text-decoration:none;
border-radius:40px;
font-size:18px;
font-weight:600;
}

footer{
padding:25px;
text-align:center;
background:#f5f5f5;
margin-top:50px;
color:#555;
}

@media(max-width:768px){

header{
flex-direction:column;
gap:15px;
}

nav ul{
flex-wrap:wrap;
justify-content:center;
}

.hero h1{
font-size:32px;
}

}
</style>

</head>
<body>

<header>

<div class="logo">KAVIYA STORE</div>

<nav>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="topup.html">Top Up</a></li>
<li><a href="diamonds.html">Diamonds</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>
</nav>

<a href="login.html" class="login">Login</a>

</header>

<section class="hero">

<h1>Welcome to KAVIYA STORE</h1>

<p>Fast & Secure Free Fire Top Up</p>

<a href="topup.html" class="btn">Top Up Now</a>

</section>

<footer>

© 2026 KAVIYA STORE. All Rights Reserved.

</footer>

</body>
</html>
