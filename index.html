<!DOCTYPE html>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#ffffff;
color:#222;
}

header{
width:100%;
height:75px;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
padding:0 30px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
position:sticky;
top:0;
z-index:999;
}

.logo{
font-size:28px;
font-weight:700;
color:#ff6b00;
letter-spacing:1px;
}

nav ul{
display:flex;
list-style:none;
gap:25px;
}

nav ul li a{
text-decoration:none;
color:#222;
font-weight:600;
transition:0.3s;
}

nav ul li a:hover{
color:#ff6b00;
}

.slider-container{
max-width:1200px;
margin:20px auto;
padding:0 20px;
}

.slider{
width:100%;
height:420px;
position:relative;
overflow:hidden;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,0.12);
}

.slide{
position:absolute;
width:100%;
height:100%;
opacity:0;
transition:2s ease-in-out;
}

.slide.active{
opacity:1;
}

.slide img{
width:100%;
height:100%;
object-fit:cover;
}

.hero{
padding:60px 20px;
text-align:center;
background: linear-gradient(180deg, #ffffff 0%, #fff5ec 100%);
}

.hero img{
width:280px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.hero h1{
margin-top:25px;
font-size:45px;
color:#ff6b00;
font-weight:800;
}

.hero p{
margin-top:10px;
font-size:18px;
color:#666;
}

.topup{
display:inline-block;
margin-top:30px;
padding:12px 35px;
background:linear-gradient(90deg, #ff6b00, #ff8a00);
color:#fff;
text-decoration:none;
font-size:17px;
border-radius:40px;
font-weight:600;
transition:0.3s;
box-shadow: 0 5px 20px rgba(255,107,0,0.35);
}

.topup:hover{
transform:scale(1.08);
box-shadow: 0 8px 25px rgba(255,107,0,0.5);
}

@media(max-width:768px){
header{flex-direction:column;height:auto;padding:15px;}
nav ul{flex-wrap:wrap;justify-content:center;margin:15px 0;}
.slider{height:220px;}
.hero img{width:90%;}
.hero h1{font-size:32px;}
}

</style>
</head>
<body>
<header>
<div class="logo">KAVIYA STORE</div>
<nav>
<ul>

<li><a href="topup.html">TOP UP</a></li>

<li><a href="contact.html">CONTACT</a></li>
</ul>
</nav>
</header>

<div class="slider-container">
<div class="slider">
<div class="slide active"><img src="IMG-20260702-WA0003.jpg" alt="Free Fire Offer 1" loading="lazy"></div>
<div class="slide"><img src="IMG-20260709-WA0008.jpg" alt="Free Fire Offer 2" loading="lazy"></div>
<div class="slide"><img src="IMG-20260729-WA0002.jpg" alt="Free Fire Offer 3" loading="lazy"></div>
</div>
</div>

<section class="hero">
<img src="IMG-20260729-WA0001.jpg" alt="Free Fire Logo" loading="lazy">

<p>Fast & Secure Diamond Top Up</p>
<a href="topup.html" class="topup">TOP UP NOW</a>
</section>

<section style="padding:60px 20px;text-align:center;">
<h2>Why Choose Us?</h2>
<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-top:30px;">
<div style="background:#fff;padding:25px;width:250px;border-radius:20px;box-shadow:0 5px 15px rgba(0,0,0,0.08);">⚡ Instant Top Up</div>
<div style="background:#fff;padding:25px;width:250px;border-radius:20px;box-shadow:0 5px 15px rgba(0,0,0,0.08);">🔒 Secure Payments</div>
<div style="background:#fff;padding:25px;width:250px;border-radius:20px;box-shadow:0 5px 15px rgba(0,0,0,0.08);">📞 24/7 Support</div>
</div>
</section>

<!-- PURANA FOOTER EKA AIN KALA -->

<script>
let slides=document.querySelectorAll(".slide");
let current=0;
function autoSlide(){
slides[current].classList.remove("active");
current++;
if(current>=slides.length){current=0;}
slides[current].classList.add("active");
}
setInterval(autoSlide,4000);
</script>
