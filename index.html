<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#0a0f2c;color:#fff;} /* bg eka danukaya wage dark blue */

/* 🔥 DANUKAYA STYLE HEADER */
header{
  width:100%;
  background: linear-gradient(90deg, #0d1b4c 0%, #1a2a6c 100%);
  padding:12px 20px;
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
  position:sticky;
  top:0;
  z-index:999;
}
.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}
.logo-area{
  display:flex;
  align-items:center;
  gap:10px;
}
.logo-img{
  width:45px;
  height:45px;
  border-radius:12px;
  border:2px solid #ff6b00;
  object-fit:cover;
}
.welcome-text{
  font-size:12px;
  color:#aaa;
}
.store-name{
  font-size:18px;
  font-weight:800;
  color:#fff;
  letter-spacing:1px;
}
.balance-area{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,0.1);
  padding:6px 12px;
  border-radius:20px;
  font-size:14px;
  font-weight:600;
}
.balance-area span{color:#ff6b00;}
.profile-img{
  width:38px;
  height:38px;
  border-radius:50%;
  border:2px solid #ff6b00;
}

nav ul{
  display:flex;
  list-style:none;
  justify-content:space-around;
  gap:5px;
}
nav ul li a{
  text-decoration:none;
  color:#ccc;
  font-weight:600;
  font-size:14px;
  transition:0.3s;
  padding:8px 12px;
  border-radius:8px;
}
nav ul li a:hover, nav ul li a.active{
  color:#ff6b00; 
  background:rgba(255,107,0,0.15);
}

.slider-container{max-width:1200px;margin:20px auto;padding:0 15px;}
.slider{width:100%;height:420px;position:relative;overflow:hidden;border-radius:20px;box-shadow:0 15px 40px rgba(0,0,0,0.3);}
.slide{position:absolute;width:100%;height:100%;opacity:0;transition:0.8s ease-in-out;}
.slide.active{opacity:1;}
.slide img{width:100%;height:100%;object-fit:cover;}

.hero{padding:40px 20px;text-align:center;background: linear-gradient(180deg, #0a0f2c 0%, #121a3d 100%);}
.hero img{width:280px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.4);}
.hero h1{margin-top:25px;font-size:45px;color:#ff6b00;font-weight:800;}
.hero p{margin-top:10px;font-size:18px;color:#aaa;}
.topup{display:inline-block;margin-top:30px;padding:12px 35px;background:linear-gradient(90deg, #ff6b00, #ff8a00);color:#fff;text-decoration:none;font-size:17px;border-radius:40px;font-weight:600;transition:0.3s;box-shadow: 0 5px 20px rgba(255,107,0,0.35);}
.topup:hover{transform:scale(1.08);}

/* 🔥 FOOTER CSS */
.custom-footer{background:#06091a; color:#ccc; padding:50px 15px 20px; text-align:center; margin-top:60px;}
.footer-container{display:flex; flex-wrap:wrap; justify-content:space-around; text-align:left; max-width:1200px; margin:0 auto; gap:30px;}
.footer-section{width:30%; min-width:250px; margin-bottom:20px;}
.footer-section h2{color:#fff; font-size:22px; margin-bottom:15px;}
.footer-section ul{list-style:none; padding:0;}
.footer-section ul li{margin:10px 0;}
.footer-section ul li a{color:#aaa; text-decoration:none; transition:0.3s;}
.footer-section ul li a:hover{color:#ff6b00;}
.whatsapp-btn{display:inline-block; margin-top:10px; padding:12px 20px; background:#25D366; color:white; border-radius:50px; text-decoration:none; font-weight:600;}
.trust-box{margin:30px auto; padding:10px 20px; background:#0d1b4c; border:1px solid #1a2a6c; border-radius:50px; width:fit-content; font-weight:600;}
.social-box{background:#0d1b4c; padding:25px; border-radius:20px; margin:30px auto; max-width:600px;}
.social-grid{display:flex; justify-content:center; gap:15px; overflow-x:auto;}
.social-card img{width:50px; height:50px; border-radius:12px; transition:0.3s;}
.social-card img:hover{transform:scale(1.1);}
.contact-links{margin-top:20px;}
.call-btn,.chat-btn{display:inline-block; margin:5px; padding:12px 20px; border-radius:50px; text-decoration:none; color:#fff; font-weight:600;}
.call-btn{background:#007bff;}
.chat-btn{background:#25D366;}
.footer-bottom{border-top:1px solid #1a2a6c; margin-top:30px; padding-top:20px; font-size:14px;}
.float-btn{position:fixed; bottom:20px; right:20px; background:linear-gradient(45deg,#00c6ff,#0072ff); color:white; font-size:24px; width:55px; height:55px; display:flex; align-items:center; justify-content:center; border-radius:50%; text-decoration:none; box-shadow:0 5px 20px rgba(0,102,255,0.5); z-index:999;}

@media(max-width:768px){
 .slider{height:220px;}
 .hero img{width:90%;}
 .hero h1{font-size:32px;}
 .footer-container{flex-direction:column; text-align:center;}
 .footer-section{width:100%;}
}

</style>
</head>
<body>
<header>
  <div class="header-top">
    <div class="logo-area">
      <img src="logo.png" alt="Logo" class="logo-img"> <!-- oyage logo eka mekata danna -->

    </div>
  </div>
  <nav>
    <ul>
      <li><a href="index.html" class="active">HOME</a></li>
      <li><a href="topup.html">TOP UP</a></li>
      <li><a href="diamond.html">DIAMONDS</a></li>

<section style="padding:60px 20px;text-align:center;">
<h2>Why Choose Us?</h2>
<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-top:30px;">
<div style="background:#121a3d;padding:25px;width:250px;border-radius:20px;box-shadow:0 5px 15px rgba(0,0,0,0.3);">⚡ Instant Top Up</div>
<div style="background:#121a3d;padding:25px;width:250px;border-radius:20px;box-shadow:0 5px 15px rgba(0,0,0,0.3);">🔒 Secure Payments</div>
<div style="background:#121a3d;padding:25px;width:250px;border-radius:20px;box-shadow:0 5px 15px rgba(0,0,0,0.3);">📞 24/7 Support</div>

<!-- 🔥 FOOTER EKA LOAD WENNA DIV EKA -->
<div id="footer"></div>

<script>
let slides=document.querySelectorAll(".slide");
let current=0;
function autoSlide(){
slides[current].classList.remove("active");
current++;
if(current>=slides.length){current=0;}
slides[current].classList.add("active");
}
setInterval(autoSlide,4000);

// 🔥 FOOTER.HTML LOAD KARANNA
fetch('footer.html')
.then(response => response.text())
.then(data => {
    document.getElementById('footer').innerHTML = data;
  }).catch(err => console.log('Footer load error:', err));

// 🔥 TELEGRAM ALERT CODE
const BOT_TOKEN = "8802199693:AAFckmH6VXvB9xoHFPFdlKzCOBPxE-7n7To"; 
const CHAT_ID = "8324590734";

function sendTelegramAlert(message) {
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
    fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({chat_id: CHAT_ID, text: message, parse_mode: 'HTML'})
    }).catch(err => console.log('Telegram error:', err));
}

let alertSent = false;
window.addEventListener('load', () => {
    if(alertSent) return;
    alertSent = true;
    fetch('https://api.ipify.org?format=json')
.then(res => res.json())
.then(data => {
        let msg = `<b>🔥 KAVIYA STORE - New Visit</b>\nIP: ${data.ip}\nTime: ${new Date().toLocaleString("en-LK")}`;
        sendTelegramAlert(msg);
    });
});

document.querySelectorAll('nav ul li a').forEach(link => {
    link.addEventListener('click', function() {
        sendTelegramAlert(`👤 "${this.innerText}" page click`);
    });
});

</script>
